name: daily
on:
  schedule:
    - cron: "37 21 * * 1-5"  # weekdays, after the 4pm ET close
  workflow_dispatch:
permissions:
  contents: write
concurrency: daily
jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
      - run: python scripts/fetch_prices.py
      - run: python scripts/detect.py
      - run: python scripts/scrape.py
      - run: python scripts/extract.py
      - run: python scripts/watch.py
      - run: python scripts/event_study.py
      # One commit per ledger row (predictions, resolutions, move results).
      - run: scripts/log_predictions.sh
      - name: Commit data if it changed, then push
        run: |
          git add public/data data
          git diff --cached --quiet || git commit -m "Daily data update $(date -u +%F)"
          git push
